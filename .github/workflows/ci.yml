name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hashed lock
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Secret scan
        run: python scripts/secret_scan.py .

      - name: Pytest
        run: python -m pytest

      - name: Build wheel
        run: python -m build --wheel
