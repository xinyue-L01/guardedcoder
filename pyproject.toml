[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardedcoder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "httpx",
    "keyring",
    "defusedxml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pip-tools",
    "build",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
